<!--
  Shared config for the agent group "kazoo" (UCPIN / UCDEMO / UCPMED nodes).
  Mounted to /var/ossec/etc/shared/kazoo/agent.conf; agents in the group pull it automatically.
  Kept light: no FIM on logs, CouchDB data or Docker volumes.
-->
<agent_config>

  <syscheck>
    <frequency>43200</frequency>
    <!-- Real-time on the files an attacker or a bad change would touch. -->
    <directories realtime="yes" report_changes="yes">/etc/kazoo,/etc/kamailio</directories>
    <directories realtime="yes" report_changes="yes">/etc/network,/etc/iptables,/etc/fail2ban,/etc/ssh,/etc/cron.d</directories>
    <directories realtime="yes" report_changes="yes">/etc/passwd,/etc/shadow,/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes">/root/.ssh,/usr/local/sbin,/usr/local/bin,/var/spool/cron</directories>
    <ignore>/etc/kazoo/kamailio/db</ignore>
    <ignore type="sregex">\.db$|\.db-wal$|\.db-shm$|\.tmp$|\.swp$|~$</ignore>
    <nodiff>/etc/shadow</nodiff>
  </syscheck>

  <!-- Kamailio secban decisions (decoders/local_decoder.xml). fonouc-secban firewall bans
       arrive through journald, which the agent reads by default. -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/kamailio/kamailio-secban.log</location>
  </localfile>

  <!-- Listening ports every 6 h; a change raises built-in rule 533 (new port opened). -->
  <localfile>
    <log_format>full_command</log_format>
    <command>ss -tulpnH | awk '{print $1, $5, $7}' | sed -E 's/,pid=[0-9]+,fd=[0-9]+//g' | sort -u</command>
    <alias>netstat listening ports</alias>
    <frequency>21600</frequency>
  </localfile>

</agent_config>
