# Wazuh 4.14.11 single node (manager + indexer + dashboard), from the official wazuh-docker
# single-node deployment (https://github.com/wazuh/wazuh-docker, tag v4.14.11), adapted:
#   - credentials from .env (see .env.example); they must match config/wazuh_indexer/internal_users.yml
#     and config/wazuh_dashboard/wazuh.yml, see README.md "Passwords"
#   - memory caps on every container, indexer heap 2 GB, cap 4 GB (the host may also run production VoIP)
#   - API on loopback; dashboard on loopback or a private IP (DASHBOARD_BIND), served at /wazuh/;
#     only the agent ports 1514/1515 are published, the server firewall limits them to our nodes
#   - syslog 514/udp is not published
#   - local rules/decoders and the "kazoo" agent group config are mounted from this folder
#
# First start: docker compose -f generate-indexer-certs.yml run --rm generator; docker compose up -d
name: wazuh

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "3" }

services:
  wazuh.manager:
    image: wazuh/wazuh-manager:${WAZUH_VERSION:-4.14.11}
    hostname: wazuh.manager
    restart: always
    logging: *logging
    mem_limit: ${MANAGER_MEM_LIMIT:-2g}
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 655360, hard: 655360 }
    ports:
      - "${AGENT_PORT:-1514}:1514"       # agent events (TLS)
      - "${ENROLL_PORT:-1515}:1515"      # agent enrollment (password, see README)
      - "127.0.0.1:${API_PORT:-55000}:55000"   # API, for the dashboard and local admin only
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD in .env}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?Set API_PASSWORD in .env}
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      # Ours: SIP/VoIP rules and decoders, and the shared config of the "kazoo" agent group.
      - ./rules/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml
      - ./decoders/local_decoder.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml
      - ./shared/kazoo/agent.conf:/wazuh-config-mount/etc/shared/kazoo/agent.conf
      - ./lists/sip-carriers:/wazuh-config-mount/etc/lists/sip-carriers
      # Agent enrollment password (git-ignored, see README): use_password=yes in ossec.conf.
      - ./config/authd.pass:/wazuh-config-mount/etc/authd.pass
      # Flock alerts (level 12+): script + the webhook env file shared with Alertmanager.
      - ./integrations/custom-flock:/wazuh-config-mount/integrations/custom-flock
      - ./integrations/custom-flock.py:/wazuh-config-mount/integrations/custom-flock.py
      - ${FLOCK_CHANNELS_FILE:-../alertmanager/secrets/flock_channels.env}:/var/ossec/etc/flock_channels.env:ro
      # Fixes ownership of the files above after the image copies them in (init/0z-local-permissions).
      - ./init/0z-local-permissions:/etc/cont-init.d/0z-local-permissions

  wazuh.indexer:
    image: wazuh/wazuh-indexer:${WAZUH_VERSION:-4.14.11}
    hostname: wazuh.indexer
    restart: always
    logging: *logging
    mem_limit: ${INDEXER_MEM_LIMIT:-4g}
    # Not published: only the manager and the dashboard talk to it, on the compose network.
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms${INDEXER_HEAP:-2g} -Xmx${INDEXER_HEAP:-2g}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:${WAZUH_VERSION:-4.14.11}
    hostname: wazuh.dashboard
    restart: always
    logging: *logging
    mem_limit: ${DASHBOARD_MEM_LIMIT:-1g}
    ports:
      # https. On 246: DASHBOARD_BIND=10.20.0.246 (private net), NPM on 244 serves it as
      # https://ocubedashboards.voicemeetme.net/wazuh/ (server.basePath in opensearch_dashboards.yml).
      - "${DASHBOARD_BIND:-127.0.0.1}:${DASHBOARD_PORT:-5443}:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${INDEXER_PASSWORD:?Set INDEXER_PASSWORD in .env}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${DASHBOARD_PASSWORD:?Set DASHBOARD_PASSWORD in .env}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${API_PASSWORD:?Set API_PASSWORD in .env}
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
