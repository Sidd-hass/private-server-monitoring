global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # Host operating system telemetry
  - job_name: 'debian_servers'
    static_configs:
      - targets: ['181.214.10.244:9100']
        labels:
          environment: 'production'
          cluster: 'multicomm'
          server_name: '181.214.10.244'
          os: 'debian'
      - targets: ['181.214.10.246:9100']
        labels:
          environment: 'production'
          cluster: 'multicomm'
          server_name: '181.214.10.246'
          os: 'debian'
      # Tasheel node-exporter target disabled:
      # - targets: ['192.168.1.178:9100']
      #   labels:
      #     environment: 'production'
      #     server_name: 'Tahseel'
      #     os: 'debian'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/*.json'
        refresh_interval: 1m
    # Fleet targets, including UCPIN, UCDEMO, and UCPMED, are registered in
    # targets/debian_servers.json and inherit cluster/server labels for Grafana.

  # - job_name: 'haproxy_tasheel'
  #   static_configs:
  #     - targets: ['192.168.1.178:8404']
  #       labels:
  #         environment: 'production'
  #         server_name: 'Tahseel'
  #         os: 'debian'

  # Existing custom Nginx Python exporters
  - job_name: 'custom_python_exporter'
    static_configs:
      - targets: ['181.214.10.244:8000']
        labels:
          environment: 'production'
          server_name: '181.214.10.244'
          os: 'debian'
      - targets: ['181.214.10.246:8000']
        labels:
          environment: 'production'
          server_name: '181.214.10.246'
          os: 'debian'

  # ICMP ping checks
  - job_name: 'blackbox_ping'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets:
          - '181.214.10.244'
        labels:
          environment: 'production'
          server_name: '181.214.10.244'
          os: 'debian'
      - targets:
          - '181.214.10.246'
        labels:
          environment: 'production'
          server_name: '181.214.10.246'
          os: 'debian'
      # Tasheel ICMP target disabled:
      # - targets:
      #     - '192.168.1.178'
      #   labels:
      #     environment: 'production'
      #     server_name: 'Tahseel'
      #     os: 'debian'
      - targets:
          - '8.8.8.8'
        labels:
          environment: 'production'
          server_name: '8.8.8.8'
          os: 'external'
      # UCPIN, UCDEMO, and UCPMED public endpoints (no VPN is listed for these sites).
      - targets:
          - '151.243.12.57'
        labels:
          environment: 'production'
          cluster: 'ucpin'
          site: 'ucpin'
          server_name: 'ucpin11'
          os: 'debian'
      - targets:
          - '151.243.12.59'
        labels:
          environment: 'production'
          cluster: 'ucpin'
          site: 'ucpin'
          server_name: 'ucpin12'
          os: 'debian'
      - targets:
          - '151.243.12.60'
        labels:
          environment: 'production'
          cluster: 'ucpin'
          site: 'ucpin'
          server_name: 'ucpin13'
          os: 'debian'
      - targets:
          - '181.214.10.237'
        labels:
          environment: 'production'
          cluster: 'ucdemo'
          site: 'ucdemo'
          server_name: 'uc11'
          os: 'debian'
      - targets:
          - '181.214.10.238'
        labels:
          environment: 'production'
          cluster: 'ucdemo'
          site: 'ucdemo'
          server_name: 'uc12'
          os: 'debian'
      - targets:
          - '143.14.172.231'
        labels:
          environment: 'production'
          cluster: 'ucpmed'
          site: 'ucpmed'
          server_name: 'ucpmed01'
          os: 'debian'
      - targets:
          - '143.14.172.232'
        labels:
          environment: 'production'
          cluster: 'ucpmed'
          site: 'ucpmed'
          server_name: 'ucpmed02'
          os: 'debian'
      # meydan/OCube hosts and gateways; probes need a route inside the cluster.
      - targets:
          - '192.168.99.46'
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'my01'
          os: 'debian'
      - targets:
          - '192.168.99.47'
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'my02'
          os: 'debian'
      - targets:
          - '192.168.99.42'
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'my03'
          os: 'debian'
      - targets:
          - '192.168.99.40'
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'my04'
          os: 'debian'
      - targets:
          - '192.168.99.175'
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'meydan-custom-report-server'
          os: 'debian'
      # Shams servers reached over the OpenVPN-routed private subnet.
      - targets:
          - '172.16.125.40'
        labels:
          environment: 'production'
          cluster: 'shams'
          site: 'shams'
          server_name: 'shams-uc01'
          os: 'debian'
      - targets:
          - '172.16.125.41'
        labels:
          environment: 'production'
          cluster: 'shams'
          site: 'shams'
          server_name: 'shams-uc02'
          os: 'debian'
      - targets:
          - '172.16.125.44'
        labels:
          environment: 'production'
          cluster: 'shams'
          site: 'shams'
          server_name: 'shams-custom-reporting-server'
          os: 'debian'
      # SPC hosts and custom report server, reached through the OpenVPN route.
      - targets:
          - '172.16.200.102'
        labels:
          environment: 'production'
          cluster: 'spc'
          site: 'spc'
          server_name: 'spc-sj01'
          os: 'debian'
      - targets:
          - '172.16.200.103'
        labels:
          environment: 'production'
          cluster: 'spc'
          site: 'spc'
          server_name: 'spc-sj02'
          os: 'debian'
      - targets:
          - '172.16.200.104'
        labels:
          environment: 'production'
          cluster: 'spc'
          site: 'spc'
          server_name: 'spc-sj03'
          os: 'debian'
      - targets:
          - '172.16.200.106'
        labels:
          environment: 'production'
          cluster: 'spc'
          site: 'spc'
          server_name: 'spc-custom-reporting-server'
          os: 'debian'
      # Dubai South servers reachable over the OpenVPN-routed private subnet.
      - targets:
          - '192.168.160.6'
        labels:
          environment: 'production'
          cluster: 'dubai_south'
          site: 'dubai-south'
          server_name: 'ds01'
          os: 'debian'
      - targets:
          - '192.168.160.7'
        labels:
          environment: 'production'
          cluster: 'dubai_south'
          site: 'dubai-south'
          server_name: 'ds02'
          os: 'debian'
      - targets:
          - '192.168.160.213'
        labels:
          environment: 'production'
          cluster: 'dubai_south'
          site: 'dubai-south'
          server_name: 'dsouth-ocube-custom-report'
          os: 'debian'
      - targets:
          - '192.168.160.214'
        labels:
          environment: 'production'
          cluster: 'dubai_south'
          site: 'dubai-south'
          server_name: 'dsouth-ocube-transcript'
          os: 'debian'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Gateway ICMP probes originate from my02, which can route to the private gateway subnet.
  - job_name: 'blackbox_ping_meydan'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets: ['172.21.2.17']
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'freeswitch-gateway'
          os: 'gateway'
      - targets: ['172.21.2.14']
        labels:
          environment: 'production'
          cluster: 'meydan'
          site: 'ocube'
          server_name: 'sbc-gateway'
          os: 'gateway'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.99.47:9115

  # Probe the Dubai South GSM gateway from a Blackbox Exporter inside that subnet.
  - job_name: 'blackbox_ping_dubai_south'
    metrics_path: /probe
    params:
      module: [icmp_ping]
    static_configs:
      - targets: ['192.168.160.211']
        labels:
          environment: 'production'
          cluster: 'dubai_south'
          site: 'dubai-south'
          server_name: 'gsm-gateway-ds'
          os: 'gateway'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 192.168.160.6:9115

  # public probes for the ocube cluster

    # ============================================================
  # PUBLIC ICMP - MEYDAN / SHAMS / DUBAI SOUTH / SPC
  # ============================================================

  - job_name: 'blackbox_ping_public'

    metrics_path: /probe

    params:
      module: [icmp_ping]

    static_configs:

      # ========================================================
      # MEYDAN
      # ========================================================

      - targets:
          - '94.206.56.70'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my01'
          public_ip: '94.206.56.70'
          private_ip: '192.168.99.46'
          os: 'debian'

      - targets:
          - '91.72.120.82'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my02'
          public_ip: '91.72.120.82'
          private_ip: '192.168.99.47'
          os: 'debian'

      - targets:
          - '91.72.120.83'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my03'
          public_ip: '91.72.120.83'
          private_ip: '192.168.99.42'
          os: 'debian'

      - targets:
          - '91.72.120.84'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my04'
          public_ip: '91.72.120.84'
          private_ip: '192.168.99.40'
          os: 'debian'

      - targets:
          - '14.195.189.86'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'freeswitch-gateway'
          public_ip: '14.195.189.86'
          private_ip: '172.21.2.17'
          os: 'gateway'

      # Shared public IP with my01
      - targets:
          - '94.206.56.70'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'meydan-custom-report-server'
          public_ip: '94.206.56.70'
          private_ip: '192.168.99.175'
          os: 'debian'


      # ========================================================
      # SHAMS
      # ========================================================

      - targets:
          - '94.205.197.125'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'shams'
          cluster: 'shams'
          server_name: 'shams-uc01'
          public_ip: '94.205.197.125'
          private_ip: '172.16.125.40'
          os: 'debian'

      - targets:
          - '94.205.197.126'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'shams'
          cluster: 'shams'
          server_name: 'shams-uc02'
          public_ip: '94.205.197.126'
          private_ip: '172.16.125.41'
          os: 'debian'

      # Shared public IP with shams-uc01
      - targets:
          - '94.205.197.125'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'shams'
          cluster: 'shams'
          server_name: 'shams-custom-reporting-server'
          public_ip: '94.205.197.125'
          private_ip: '172.16.125.44'
          os: 'debian'


      # ========================================================
      # DUBAI SOUTH
      # ========================================================

      - targets:
          - '91.72.107.250'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'dubai-south'
          cluster: 'dubai_south'
          server_name: 'ds01'
          public_ip: '91.72.107.250'
          private_ip: '192.168.160.6'
          os: 'debian'

      - targets:
          - '91.72.107.251'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'dubai-south'
          cluster: 'dubai_south'
          server_name: 'ds02'
          public_ip: '91.72.107.251'
          private_ip: '192.168.160.7'
          os: 'debian'

      # Shared public IP according to supplied inventory
      - targets:
          - '91.72.107.250'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'dubai-south'
          cluster: 'dubai_south'
          server_name: 'dsouth-ocube-custom-report'
          public_ip: '91.72.107.250'
          private_ip: '192.168.160.21'
          os: 'debian'

      # Shared public IP according to supplied inventory
      - targets:
          - '91.72.107.250'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'dubai-south'
          cluster: 'dubai_south'
          server_name: 'dsouth-ocube-transcript'
          public_ip: '91.72.107.250'
          private_ip: '192.168.160.21'
          os: 'debian'


      # ========================================================
      # SPC
      # ========================================================

      - targets:
          - '91.72.107.141'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-sj01'
          public_ip: '91.72.107.141'
          private_ip: '172.16.200.102'
          os: 'debian'

      - targets:
          - '91.72.107.142'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-sj02'
          public_ip: '91.72.107.142'
          private_ip: '172.16.200.103'
          os: 'debian'

      - targets:
          - '91.72.107.140'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-sj03'
          public_ip: '91.72.107.140'
          private_ip: '172.16.200.104'
          os: 'debian'

      # Shared public IP according to supplied inventory
      - targets:
          - '91.72.107.142'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-custom-reporting-server'
          public_ip: '91.72.107.142'
          private_ip: '172.16.200.106'
          os: 'debian'


    relabel_configs:

      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115


  # ============================================================
  # PUBLIC TCP / NODE EXPORTER
  #
  # IMPORTANT:
  # Only unique public IPs assigned to the main servers are
  # included here.
  #
  # Shared public IPs used by custom report servers cannot
  # uniquely identify the internal server through TCP/9100.
  # ============================================================

  - job_name: 'blackbox_tcp_public'

    metrics_path: /probe

    params:
      module: [tcp_connect]

    static_configs:

      # --------------------------------------------------------
      # MEYDAN
      # --------------------------------------------------------

      - targets:
          - '94.206.56.70:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my01'
          public_ip: '94.206.56.70'
          private_ip: '192.168.99.46'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '91.72.120.82:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my02'
          public_ip: '91.72.120.82'
          private_ip: '192.168.99.47'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '91.72.120.83:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my03'
          public_ip: '91.72.120.83'
          private_ip: '192.168.99.42'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '91.72.120.84:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'meydan'
          cluster: 'meydan'
          server_name: 'my04'
          public_ip: '91.72.120.84'
          private_ip: '192.168.99.40'
          service: 'node-exporter'
          port: '9100'


      # --------------------------------------------------------
      # SHAMS
      # --------------------------------------------------------

      - targets:
          - '94.205.197.125:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'shams'
          cluster: 'shams'
          server_name: 'shams-uc01'
          public_ip: '94.205.197.125'
          private_ip: '172.16.125.40'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '94.205.197.126:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'shams'
          cluster: 'shams'
          server_name: 'shams-uc02'
          public_ip: '94.205.197.126'
          private_ip: '172.16.125.41'
          service: 'node-exporter'
          port: '9100'


      # --------------------------------------------------------
      # DUBAI SOUTH
      # --------------------------------------------------------

      - targets:
          - '91.72.107.250:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'dubai-south'
          cluster: 'dubai_south'
          server_name: 'ds01'
          public_ip: '91.72.107.250'
          private_ip: '192.168.160.6'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '91.72.107.251:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'dubai-south'
          cluster: 'dubai_south'
          server_name: 'ds02'
          public_ip: '91.72.107.251'
          private_ip: '192.168.160.7'
          service: 'node-exporter'
          port: '9100'


      # --------------------------------------------------------
      # SPC
      # --------------------------------------------------------

      - targets:
          - '91.72.107.141:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-sj01'
          public_ip: '91.72.107.141'
          private_ip: '172.16.200.102'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '91.72.107.142:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-sj02'
          public_ip: '91.72.107.142'
          private_ip: '172.16.200.103'
          service: 'node-exporter'
          port: '9100'

      - targets:
          - '91.72.107.140:9100'
        labels:
          environment: 'production'
          monitoring_layer: 'public'
          site: 'spc'
          cluster: 'spc'
          server_name: 'spc-sj03'
          public_ip: '91.72.107.140'
          private_ip: '172.16.200.104'
          service: 'node-exporter'
          port: '9100'


    relabel_configs:

      - source_labels: [__address__]
        target_label: __param_target

      - source_labels: [__param_target]
        target_label: instance

      - target_label: __address__
        replacement: blackbox-exporter:9115

  # TCP port probes
  - job_name: 'blackbox_tcp'
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - '181.214.10.244:9100'
          - '181.214.10.244:8000'
      - targets:
          - '181.214.10.246:9100'
          - '181.214.10.246:8000'
      # Tasheel TCP probe disabled:
      # - targets:
      #     - '192.168.1.178:9100'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # HTTP endpoint probes
  - job_name: 'blackbox_http'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - 'http://181.214.10.244:8000/metrics'
      - targets:
          - 'http://181.214.10.246:8000/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115
