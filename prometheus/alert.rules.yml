groups:
  - name: debian_system_alerts
    rules:
      - alert: CpuSpike
        expr: 100 - (avg by (instance, server_name) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU Spike on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "CPU usage exceeded 85% for 5 minutes on server {{ $labels.server_name }}."

      - alert: RamCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "RAM Critical on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Memory usage exceeded 90% for 3 minutes on server {{ $labels.server_name }}."

      - alert: DiskCritical
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root Disk Space Low on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Root partition (/) disk usage exceeded 85% for 5 minutes on server {{ $labels.server_name }}."

      - alert: NasUsageWarning
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"} / node_filesystem_size_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"})) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS space usage high on {{ $labels.server_name }}"
          description: "NAS mount /u2_nas is over 80% full. Current usage is {{ $value | printf \"%.1f\" }}%."

      - alert: NasUsageCritical
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"} / node_filesystem_size_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"})) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NAS space critically low on {{ $labels.server_name }}"
          description: "NAS mount /u2_nas is over 90% full. Current usage is {{ $value | printf \"%.1f\" }}%."

      - alert: NasMountMissing
        expr: absent(node_filesystem_size_bytes{job="debian_servers", server_name="Tahseel", instance="192.168.1.178:9100", mountpoint="/u2_nas", fstype="cifs"}) and on(instance) (up{job="debian_servers", server_name="Tahseel", instance="192.168.1.178:9100"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NAS mount missing on {{ $labels.server_name }}"
          description: "Prometheus can scrape Tahseel, but Node Exporter reports no CIFS filesystem at /u2_nas."

      - alert: ServerDown
        expr: up{job="debian_servers"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Server Down: {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Debian server OS target {{ $labels.server_name }} ({{ $labels.instance }}) is unreachable."

  - name: meydan_gateway_alerts
    rules:
      - alert: meydanGatewayUnreachable
        expr: |
          (probe_success{job="blackbox_ping_meydan", cluster="meydan"} == 0)
          or
          (up{job="blackbox_ping_meydan", cluster="meydan"} == 0)
        for: 0s
        labels:
          severity: critical
        annotations:
          summary: "meydan gateway unreachable: {{ $labels.server_name }}"
          description: "The ICMP probe for {{ $labels.server_name }} ({{ $labels.instance }}) has failed, or Prometheus cannot scrape the meydan Blackbox Exporter, for at least 1 minute."

  - name: ping_probe_alerts
    rules:
      - alert: PublicPingDown
        expr: probe_success{job="blackbox_ping_public", cluster=~"meydan|shams|dubai_south|spc"} == 0
        for: 0s
        labels:
          severity: critical
          probe_type: public
        annotations:
          summary: "Public ping DOWN: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "The public IP ping probe for {{ $labels.server_name }} ({{ $labels.cluster }}, {{ $labels.public_ip }}) has failed."

      - alert: PrivatePingDown
        expr: probe_success{job="blackbox_ping", cluster=~"meydan|shams|dubai_south|spc"} == 0
        for: 0s
        labels:
          severity: critical
          probe_type: private
        annotations:
          summary: "Private ping DOWN: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "The private IP ping probe for {{ $labels.server_name }} ({{ $labels.cluster }}, {{ $labels.instance }}) has failed."

  # ---------------------------------------------------------------------------
  # SIP trunks (fonouc_freeswitch_trunk), from scripts/freeswitch_trunk_metrics.sh
  # via each trunk node's node_exporter textfile collector.
  # Registration state is deliberately not an alert label: a state change
  # (FAIL_WAIT -> TRYING) would otherwise resolve and re-fire the alert.
  # "Active" trunk nodes = nodes that reported a gateway in the last 24h, so
  # standby nodes (ds01, Meydan gw) never alert.
  # ---------------------------------------------------------------------------
  - name: sip_trunk_alerts
    rules:
      - alert: SipTrunkDown
        # SPC du_ae_trunk (065100200) has been FAIL_WAIT since before monitoring;
        # excluded until dev confirms whether it is still in use.
        expr: |
          (freeswitch_gateway_up == 0)
          unless on(server_name, gateway)
          freeswitch_gateway_up{server_name="spc-sj02", gateway="du_ae_trunk"}
        for: 2m
        labels:
          severity: critical
          alert_type: trunk
        annotations:
          summary: "SIP trunk DOWN: {{ $labels.cluster }} / {{ $labels.gateway }} ({{ $labels.number }})"
          description: "Trunk {{ $labels.gateway }} (DU number {{ $labels.number }}) on {{ $labels.server_name }} has not been registered (FreeSWITCH Status DOWN) for 2 minutes. Calls through this trunk are failing."

      - alert: SipTrunkContainerDown
        expr: trunk_container_running == 0 and on(instance) count by (instance) (max_over_time(freeswitch_gateway_up[1d]))
        for: 1m
        labels:
          severity: critical
          alert_type: trunk
        annotations:
          summary: "Trunk container stopped: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "fonouc_freeswitch_trunk is not running on {{ $labels.server_name }} ({{ $labels.instance }}), which carried a trunk in the last 24 hours. All trunks on this node are down."

      - alert: SipTrunkFreeswitchNotAnswering
        expr: freeswitch_trunk_scrape_ok == 0 and on(instance) (trunk_container_running == 1) and on(instance) count by (instance) (max_over_time(freeswitch_gateway_up[1d]))
        for: 2m
        labels:
          severity: critical
          alert_type: trunk
        annotations:
          summary: "Trunk FreeSWITCH not answering: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "fonouc_freeswitch_trunk is running on {{ $labels.server_name }} but fs_cli on ESL 8023 has not answered for 2 minutes. Trunk status cannot be read."

      - alert: SipTrunkMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*freeswitch_trunk.prom"} > 300
        for: 2m
        labels:
          severity: warning
          alert_type: trunk
        annotations:
          summary: "Trunk metrics stale on {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "freeswitch_trunk.prom on {{ $labels.server_name }} has not been updated for {{ $value | humanizeDuration }}. Check the fs_trunk_metrics cron job (journalctl -u cron)."

  - name: custom_nginx_alerts
    rules:
      - alert: CustomNginxExporterDown
        expr: up{job="custom_python_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Custom Nginx Exporter Down on {{ $labels.server_name }}"
          description: "The exporter container on {{ $labels.server_name }} ({{ $labels.instance }}) is unreachable."

      - alert: NginxDown
        expr: custom_nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx Web Server DOWN on {{ $labels.server_name }}"
          description: "The Nginx web server process on {{ $labels.server_name }} ({{ $labels.instance }}) is unreachable or failing status checks."

      - alert: NginxHighHttp5xxErrors
        expr: sum(rate(custom_nginx_http_requests_total{status_code=~"5.."}[5m])) by (server_name, instance) > 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Server Errors on {{ $labels.server_name }}"
          description: "Nginx on {{ $labels.server_name }} ({{ $labels.instance }}) is generating over 2 5xx errors/sec."

      - alert: NginxHighHttp4xxErrors
        expr: sum(rate(custom_nginx_http_requests_total{status_code=~"4.."}[5m])) by (server_name, instance) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 4xx Client Errors on {{ $labels.server_name }}"
          description: "Nginx on {{ $labels.server_name }} ({{ $labels.instance }}) is generating high 4xx client errors (404/403/401)."

      - alert: NginxHighActiveConnections
        expr: custom_nginx_active_connections > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Active Nginx Connections on {{ $labels.server_name }}"
          description: "Active connections reached {{ $value }} on {{ $labels.server_name }} ({{ $labels.instance }})."

  # ---------------------------------------------------------------------------
  # Log pipeline health (Loki + Alloy). These are metric alerts, so Prometheus
  # evaluates them. Needs the "loki" and "alloy" scrape jobs in prometheus.yml.
  # ---------------------------------------------------------------------------
  - name: log_pipeline_alerts
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down on {{ $labels.server_name }}"
          description: "Prometheus cannot scrape Loki ({{ $labels.instance }}). Log ingestion and the System-Wide Log Observatory dashboard are affected."

      - alert: AlloyDown
        expr: up{job="alloy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alloy log collector is down on {{ $labels.server_name }}"
          description: "Prometheus cannot scrape Alloy ({{ $labels.instance }}). No new logs are being shipped from this host."

      - alert: AlloyDroppingLogs
        expr: sum by (instance, server_name) (rate(loki_write_dropped_entries_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alloy is dropping log entries on {{ $labels.server_name }}"
          description: "Alloy ({{ $labels.instance }}) is dropping {{ $value | printf \"%.2f\" }} entries/sec because Loki is rejecting or not accepting them."

      - alert: LokiServerErrors
        expr: sum by (instance, route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is returning 5xx errors on {{ $labels.route }}"
          description: "Loki ({{ $labels.instance }}) has returned server errors on route {{ $labels.route }} for 5 minutes."