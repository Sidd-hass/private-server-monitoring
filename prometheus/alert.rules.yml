groups:
  - name: debian_system_alerts
    rules:
      - alert: CpuSpike
        expr: 100 - (avg by (cluster, instance, server_name) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CPU Spike on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "CPU usage exceeded 85% for 5 minutes on server {{ $labels.server_name }}."

      # Early warning: fire before the hosting provider's memory threshold does.
      - alert: RamHigh
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RAM High on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Memory usage has been above 80% for 10 minutes on server {{ $labels.server_name }}. Current usage is {{ $value | printf \"%.1f\" }}%."

      - alert: RamCritical
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "RAM Critical on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Memory usage exceeded 90% for 3 minutes on server {{ $labels.server_name }}."

      - alert: DiskCritical
        expr: 100 - ((node_filesystem_avail_bytes{mountpoint="/"} * 100) / node_filesystem_size_bytes{mountpoint="/"}) > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Root Disk Space Low on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Root partition (/) disk usage exceeded 85% for 5 minutes on server {{ $labels.server_name }}."

      - alert: NasUsageWarning
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"} / node_filesystem_size_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"})) > 80
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS space usage high on {{ $labels.server_name }}"
          description: "NAS mount /u2_nas is over 80% full. Current usage is {{ $value | printf \"%.1f\" }}%."

      - alert: NasUsageCritical
        expr: 100 * (1 - (node_filesystem_avail_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"} / node_filesystem_size_bytes{job="debian_servers", server_name="Tahseel", mountpoint="/u2_nas", fstype="cifs"})) > 90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "NAS space critically low on {{ $labels.server_name }}"
          description: "NAS mount /u2_nas is over 90% full. Current usage is {{ $value | printf \"%.1f\" }}%."

      - alert: NasMountMissing
        expr: absent(node_filesystem_size_bytes{job="debian_servers", server_name="Tahseel", instance="192.168.1.178:9100", mountpoint="/u2_nas", fstype="cifs"}) and on(instance) (up{job="debian_servers", server_name="Tahseel", instance="192.168.1.178:9100"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "NAS mount missing on {{ $labels.server_name }}"
          description: "Prometheus can scrape Tahseel, but Node Exporter reports no CIFS filesystem at /u2_nas."

      - alert: ServerDown
        expr: up{job="debian_servers"} == 0
        for: 1m
        labels:
          severity: page
        annotations:
          summary: "Server Down: {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Debian server OS target {{ $labels.server_name }} ({{ $labels.instance }}) is unreachable."

  # Resource pressure: catches contention that a plain usage % hides.
  - name: host_pressure_alerts
    rules:
      - alert: RootDiskFillingUp
        expr: predict_linear(node_filesystem_avail_bytes{job="debian_servers", mountpoint="/"}[6h], 24 * 3600) < 0 and node_filesystem_avail_bytes{job="debian_servers", mountpoint="/"} / node_filesystem_size_bytes{job="debian_servers", mountpoint="/"} < 0.25
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Root disk will fill within 24h on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "At the growth rate of the last 6 hours, / on {{ $labels.server_name }} runs out of space within 24 hours."

      - alert: MemoryPressure
        expr: rate(node_pressure_memory_waiting_seconds_total{job="debian_servers"}[5m]) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Memory pressure on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "Tasks on {{ $labels.server_name }} have been stalled waiting for memory {{ $value | humanizePercentage }} of the time for 10 minutes. The working set no longer fits in RAM."

      - alert: HostSwappingActively
        expr: rate(node_vmstat_pswpin{job="debian_servers"}[5m]) > 100
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Active swapping on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "{{ $labels.server_name }} has been reading {{ $value | printf \"%.0f\" }} pages/s back from swap for 15 minutes."

      - alert: OomKillDetected
        expr: increase(node_vmstat_oom_kill{job="debian_servers"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OOM killer fired on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "The kernel killed a process for lack of memory on {{ $labels.server_name }} in the last 10 minutes. Check dmesg / journalctl -k for the victim."

      - alert: CpuStealHigh
        expr: avg by (cluster, instance, server_name) (rate(node_cpu_seconds_total{job="debian_servers", mode="steal"}[5m])) * 100 > 10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "High CPU steal on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "The hypervisor has withheld {{ $value | printf \"%.1f\" }}% of CPU time from {{ $labels.server_name }} for 15 minutes. The provider host is oversubscribed."

  - name: meydan_gateway_alerts
    rules:
      - alert: meydanGatewayUnreachable
        expr: |
          (avg_over_time(probe_success{job="blackbox_ping_meydan", cluster="meydan"}[5m]) < 0.5)
          or
          (up{job="blackbox_ping_meydan", cluster="meydan"} == 0)
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "meydan gateway unreachable: {{ $labels.server_name }}"
          description: "The ICMP probe for {{ $labels.server_name }} ({{ $labels.instance }}) has failed more than half the time over 5 minutes, or Prometheus cannot scrape the meydan Blackbox Exporter, for at least 3 minutes."

  - name: ping_probe_alerts
    rules:
      - alert: PublicPingDown
        # meydan/shams/spc public IPs do not answer ICMP, so only dubai_south is alerted on.
        expr: avg_over_time(probe_success{job="blackbox_ping_public", cluster=~"dubai_south"}[5m]) < 0.5
        for: 3m
        labels:
          severity: critical
          probe_type: public
        annotations:
          summary: "Public ping DOWN: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "The public IP ping probe for {{ $labels.server_name }} ({{ $labels.cluster }}, {{ $labels.public_ip }}) has failed more than half the time over 5 minutes."

      - alert: PrivatePingDown
        expr: avg_over_time(probe_success{job="blackbox_ping", cluster=~"meydan|shams|dubai_south|spc"}[5m]) < 0.5
        for: 3m
        labels:
          severity: critical
          probe_type: private
        annotations:
          summary: "Private ping DOWN: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "The private IP ping probe for {{ $labels.server_name }} ({{ $labels.cluster }}, {{ $labels.instance }}) has failed more than half the time over 5 minutes."

  # ---------------------------------------------------------------------------
  # SIP trunks (fonouc_freeswitch_trunk), from scripts/freeswitch_trunk_metrics.sh
  # via each trunk node's node_exporter textfile collector.
  # Registration state is deliberately not an alert label: a state change
  # (FAIL_WAIT -> TRYING) would otherwise resolve and re-fire the alert.
  # "Active" trunk nodes = nodes that reported a gateway in the last 24h, so
  # standby nodes (ds01, Meydan gw) never alert.
  # ---------------------------------------------------------------------------
  - name: sip_trunk_alerts
    rules:
      - alert: SipTrunkDown
        # SPC du_ae_trunk (065100200) has been FAIL_WAIT since before monitoring;
        # excluded until dev confirms whether it is still in use.
        expr: |
          (freeswitch_gateway_up == 0)
          unless on(server_name, gateway)
          freeswitch_gateway_up{server_name="spc-sj02", gateway="du_ae_trunk"}
        for: 2m
        labels:
          severity: critical
          alert_type: trunk
        annotations:
          summary: "SIP trunk DOWN: {{ $labels.cluster }} / {{ $labels.gateway }} ({{ $labels.number }})"
          description: "Trunk {{ $labels.gateway }} (DU number {{ $labels.number }}) on {{ $labels.server_name }} has not been registered (FreeSWITCH Status DOWN) for 2 minutes. Calls through this trunk are failing."

      - alert: SipTrunkContainerDown
        expr: trunk_container_running == 0 and on(instance) count by (instance) (max_over_time(freeswitch_gateway_up[1d]))
        for: 1m
        labels:
          severity: critical
          alert_type: trunk
        annotations:
          summary: "Trunk container stopped: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "fonouc_freeswitch_trunk is not running on {{ $labels.server_name }} ({{ $labels.instance }}), which carried a trunk in the last 24 hours. All trunks on this node are down."

      - alert: SipTrunkFreeswitchNotAnswering
        expr: freeswitch_trunk_scrape_ok == 0 and on(instance) (trunk_container_running == 1) and on(instance) count by (instance) (max_over_time(freeswitch_gateway_up[1d]))
        for: 2m
        labels:
          severity: critical
          alert_type: trunk
        annotations:
          summary: "Trunk FreeSWITCH not answering: {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "fonouc_freeswitch_trunk is running on {{ $labels.server_name }} but fs_cli on ESL 8023 has not answered for 2 minutes. Trunk status cannot be read."

      - alert: SipTrunkMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*freeswitch_trunk.prom"} > 300
        for: 2m
        labels:
          severity: warning
          alert_type: trunk
        annotations:
          summary: "Trunk metrics stale on {{ $labels.cluster }} / {{ $labels.server_name }}"
          description: "freeswitch_trunk.prom on {{ $labels.server_name }} has not been updated for {{ $value | humanizeDuration }}. Check the fs_trunk_metrics cron job (journalctl -u cron)."

  # ---------------------------------------------------------------------------
  # RabbitMQ (Kazoo message bus), from the built-in rabbitmq_prometheus plugin,
  # relayed by kazoo_service_metrics.sh through each node's node_exporter.
  # rabbitmq_queue_* on /metrics are node-wide totals across all queues.
  # ---------------------------------------------------------------------------
  - name: rabbitmq_alerts
    rules:
      - alert: RabbitMQQueueBacklog
        expr: sum by (cluster, instance, server_name) (rabbitmq_queue_messages) > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ backlog on {{ $labels.server_name }} ({{ $labels.instance }})"
          description: "{{ $value | printf \"%.0f\" }} messages have been queued for 10 minutes on {{ $labels.server_name }}. Consumers are not keeping up; queued messages hold broker memory."

      - alert: RabbitMQMemoryHigh
        expr: rabbitmq_process_resident_memory_bytes / rabbitmq_resident_memory_limit_bytes * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ near memory watermark on {{ $labels.server_name }}"
          description: "RabbitMQ on {{ $labels.server_name }} is using {{ $value | printf \"%.1f\" }}% of its vm_memory_high_watermark. Publishers will be blocked at 100%."

      - alert: RabbitMQMemoryAlarm
        expr: rabbitmq_alarms_memory_used_watermark == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ memory alarm on {{ $labels.server_name }}"
          description: "RabbitMQ on {{ $labels.server_name }} has hit its memory watermark and is blocking publishers. Kazoo messaging is stalled."

      - alert: RabbitMQDiskAlarm
        expr: rabbitmq_alarms_free_disk_space_watermark == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ disk alarm on {{ $labels.server_name }}"
          description: "Free disk on {{ $labels.server_name }} is below RabbitMQ's disk_free_limit; publishers are blocked."

      - alert: RabbitMQFileDescriptorAlarm
        expr: rabbitmq_alarms_file_descriptor_limit == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ file descriptor alarm on {{ $labels.server_name }}"
          description: "RabbitMQ on {{ $labels.server_name }} has run out of file descriptors and refuses new connections."

  # ---------------------------------------------------------------------------
  # Kazoo node services, from scripts/kazoo_service_metrics.sh (cron, every
  # minute) through each node's node_exporter textfile collector.
  # ---------------------------------------------------------------------------
  - name: kazoo_service_alerts
    rules:
      - alert: KazooServiceMetricsStale
        expr: time() - node_textfile_mtime_seconds{file=~".*kazoo_services.prom"} > 300
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Kazoo service metrics stale on {{ $labels.server_name }}"
          description: "kazoo_services.prom on {{ $labels.server_name }} has not been updated for {{ $value | humanizeDuration }}. Check /etc/cron.d/kazoo_service_metrics and run /opt/server-monitorig/kazoo_service_metrics.sh --stdout."

      - alert: KazooContainerDown
        expr: kazoo_container_running{container=~"fonouc_.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Container {{ $labels.container }} stopped on {{ $labels.server_name }}"
          description: "{{ $labels.container }} on {{ $labels.server_name }} has not been running for 2 minutes."

      - alert: KazooContainerRestarted
        expr: changes(kazoo_container_start_time_seconds{container=~"fonouc_.*"}[10m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Container {{ $labels.container }} restarted on {{ $labels.server_name }}"
          description: "{{ $labels.container }} on {{ $labels.server_name }} started again in the last 10 minutes. Check docker logs and journalctl -k for OOM kills."

      - alert: CouchDBDown
        expr: kazoo_couchdb_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CouchDB not answering on {{ $labels.server_name }}"
          description: "CouchDB on {{ $labels.server_name }} has not answered on 127.0.0.1:5984 for 2 minutes."

      - alert: CouchDBDiskShareHigh
        # group_left() keeps the CouchDB series' labels (server_name, cluster); without it the
        # alert only had "instance" and reached neither the cluster channel nor the main Flock channel.
        expr: kazoo_couchdb_file_bytes_sum / on(instance) group_left() node_filesystem_size_bytes{mountpoint="/"} > 0.6
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "CouchDB uses {{ $value | humanizePercentage }} of the root disk on {{ $labels.server_name }}"
          description: "CouchDB data on {{ $labels.server_name }} has grown past 60% of the root filesystem. Check the Databases table on the Kazoo Platform Health dashboard and compaction/MODB retention."

      - alert: CouchDBSlowRequests
        expr: kazoo_couchdb_stat_recent{stat="couchdb.request_time", q="0.95"} > 500
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CouchDB slow on {{ $labels.server_name }}"
          description: "95th percentile CouchDB request time on {{ $labels.server_name }} has been above 500 ms for 10 minutes (now {{ $value | printf \"%.0f\" }} ms). Kazoo API and call setup slow down with it."

      - alert: CouchDBServerErrors
        expr: sum by (cluster, instance, server_name) (increase(kazoo_couchdb_stat_total{stat=~"couchdb.httpd_status_codes.5.."}[15m])) > 20
        labels:
          severity: warning
        annotations:
          summary: "CouchDB returning 5xx on {{ $labels.server_name }}"
          description: "CouchDB on {{ $labels.server_name }} returned {{ $value | printf \"%.0f\" }} server errors in the last 15 minutes. Check docker logs fonouc_couchdb."

      - alert: CouchDBMailboxBacklog
        expr: kazoo_couchdb_message_queue{process="any"} > 1000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "CouchDB internal backlog on {{ $labels.server_name }}"
          description: "An Erlang process inside CouchDB on {{ $labels.server_name }} has had over 1000 queued messages for 10 minutes. CouchDB is falling behind (usually disk I/O)."

      - alert: KazooRabbitMQDown
        expr: kazoo_rabbitmq_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ not answering on {{ $labels.server_name }}"
          description: "rabbitmqctl on {{ $labels.server_name }} has not answered for 2 minutes."

      - alert: KazooRabbitMQQueuesWithoutConsumers
        expr: kazoo_rabbitmq_queues_without_consumers > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "RabbitMQ queues with no consumer on {{ $labels.server_name }}"
          description: "{{ $value | printf \"%.0f\" }} queue(s) on {{ $labels.server_name }} hold messages that nothing is reading. They grow until the broker hits its memory watermark."

      - alert: FreeswitchDown
        expr: kazoo_freeswitch_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Media FreeSWITCH not answering on {{ $labels.server_name }}"
          description: "fs_cli on {{ $labels.server_name }} has not answered for 2 minutes. Calls on this node are affected."

      - alert: ValkeyDown
        expr: kazoo_valkey_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Valkey not answering on {{ $labels.server_name }}"
          description: "{{ $labels.container }} on {{ $labels.server_name }} has not answered INFO for 2 minutes."

      - alert: ValkeyMemoryHigh
        expr: kazoo_valkey_memory_used_bytes / (kazoo_valkey_maxmemory_bytes > 0) > 0.8
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Valkey near maxmemory on {{ $labels.server_name }}"
          description: "{{ $labels.container }} on {{ $labels.server_name }} is at {{ $value | humanizePercentage }} of maxmemory."

      - alert: ValkeyMasterLinkDown
        expr: kazoo_valkey_master_link_up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Valkey replica lost its master on {{ $labels.server_name }}"
          description: "{{ $labels.container }} on {{ $labels.server_name }} has not been connected to its master for 2 minutes; its data is going stale."

      - alert: ValkeyPersistenceFailing
        expr: kazoo_valkey_status_ok{field=~"rdb_last_bgsave_status|aof_last_write_status|aof_last_bgrewrite_status"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Valkey {{ $labels.field }} failing on {{ $labels.server_name }}"
          description: "{{ $labels.container }} on {{ $labels.server_name }} reports {{ $labels.field }} not ok. Data written now may not survive a restart (often a full disk)."

      - alert: ValkeySentinelMasterDown
        expr: kazoo_valkey_sentinel_master_ok == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Sentinel sees Valkey master {{ $labels.master }} as down ({{ $labels.server_name }})"
          description: "Sentinel on {{ $labels.server_name }} flags master {{ $labels.master }} as down. A failover should follow; if it does not, queue writes are failing."

      - alert: ValkeySentinelQuorumAtRisk
        expr: kazoo_valkey_sentinel_sentinels <= kazoo_valkey_sentinel_quorum
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Valkey Sentinel quorum at risk for {{ $labels.master }} ({{ $labels.server_name }})"
          description: "Only {{ $value }} sentinel(s) watch {{ $labels.master }}, no more than its quorum. Losing one more sentinel prevents automatic failover."

      - alert: ValkeyFailover
        expr: count by (cluster, server_name, master) (last_over_time(kazoo_valkey_sentinel_master_info[10m])) > 1
        labels:
          severity: warning
        annotations:
          summary: "Valkey master {{ $labels.master }} changed ({{ $labels.server_name }})"
          description: "Sentinel on {{ $labels.server_name }} reported more than one master address or state for {{ $labels.master }} in the last 10 minutes: a failover or master flapping."

  # Per-service pressure (cgroup v2, from kazoo_service_metrics.sh): which service is
  # short of memory/CPU before the whole host is.
  - name: kazoo_service_pressure_alerts
    rules:
      - alert: ServiceMemoryPressure
        expr: rate(kazoo_cgroup_pressure_seconds_total{resource="memory", kind="some"}[5m]) > 0.10
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.cgroup }} is short of memory on {{ $labels.server_name }}"
          description: "{{ $labels.cgroup }} ({{ $labels.service }}) has spent {{ $value | humanizePercentage }} of the last 10 minutes stalled waiting for memory. It needs more RAM than it is getting (or its limit is too low)."

      - alert: ServiceCpuPressure
        expr: rate(kazoo_cgroup_pressure_seconds_total{resource="cpu", kind="some"}[5m]) > 0.30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.cgroup }} is waiting for CPU on {{ $labels.server_name }}"
          description: "{{ $labels.cgroup }} ({{ $labels.service }}) has had tasks waiting for a CPU {{ $value | humanizePercentage }} of the time for 15 minutes."

      - alert: ServiceOomKill
        expr: increase(kazoo_cgroup_memory_events_total{event="oom_kill"}[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "OOM kill in {{ $labels.cgroup }} on {{ $labels.server_name }}"
          description: "The kernel killed a process inside {{ $labels.cgroup }} ({{ $labels.service }}) for lack of memory in the last 10 minutes."

      - alert: ServiceNearMemoryLimit
        # group_left() keeps server_name, cluster and the service labels of the left-hand series.
        expr: kazoo_cgroup_memory_bytes{type="anon"} / on(instance, cgroup) group_left() (kazoo_cgroup_memory_max_bytes > 0) > 0.9
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $labels.cgroup }} near its memory limit on {{ $labels.server_name }}"
          description: "{{ $labels.cgroup }} uses {{ $value | humanizePercentage }} of its memory limit in application memory. Raise the limit or expect OOM kills."

      - alert: HostMemoryHeadroomLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.15
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Less than 15% memory headroom on {{ $labels.server_name }}"
          description: "Only {{ $value | humanizePercentage }} of RAM is available on {{ $labels.server_name }}; the plan keeps 15-20% for the kernel and page cache."

  - name: custom_nginx_alerts
    rules:
      - alert: CustomNginxExporterDown
        expr: up{job="custom_python_exporter"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Custom Nginx Exporter Down on {{ $labels.server_name }}"
          description: "The exporter container on {{ $labels.server_name }} ({{ $labels.instance }}) is unreachable."

      - alert: NginxDown
        expr: custom_nginx_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nginx Web Server DOWN on {{ $labels.server_name }}"
          description: "The Nginx web server process on {{ $labels.server_name }} ({{ $labels.instance }}) is unreachable or failing status checks."

      - alert: NginxHighHttp5xxErrors
        expr: sum(rate(custom_nginx_http_requests_total{status_code=~"5.."}[5m])) by (cluster, server_name, instance) > 2
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High HTTP 5xx Server Errors on {{ $labels.server_name }}"
          description: "Nginx on {{ $labels.server_name }} ({{ $labels.instance }}) is generating over 2 5xx errors/sec."

      - alert: NginxHighHttp4xxErrors
        expr: sum(rate(custom_nginx_http_requests_total{status_code=~"4.."}[5m])) by (cluster, server_name, instance) > 10
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High HTTP 4xx Client Errors on {{ $labels.server_name }}"
          description: "Nginx on {{ $labels.server_name }} ({{ $labels.instance }}) is generating high 4xx client errors (404/403/401)."

      - alert: NginxHighActiveConnections
        expr: custom_nginx_active_connections > 500
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High Active Nginx Connections on {{ $labels.server_name }}"
          description: "Active connections reached {{ $value }} on {{ $labels.server_name }} ({{ $labels.instance }})."

  # ---------------------------------------------------------------------------
  # Log pipeline health (Loki + Alloy). These are metric alerts, so Prometheus
  # evaluates them. Needs the "loki" and "alloy" scrape jobs in prometheus.yml.
  # ---------------------------------------------------------------------------
  - name: log_pipeline_alerts
    rules:
      - alert: LokiDown
        expr: up{job="loki"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Loki is down on {{ $labels.server_name }}"
          description: "Prometheus cannot scrape Loki ({{ $labels.instance }}). Log ingestion and the System-Wide Log Observatory dashboard are affected."

      - alert: AlloyDown
        expr: up{job="alloy"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Alloy log collector is down on {{ $labels.server_name }}"
          description: "Prometheus cannot scrape Alloy ({{ $labels.instance }}). No new logs are being shipped from this host."

      - alert: AlloyDroppingLogs
        expr: sum by (cluster, instance, server_name) (rate(loki_write_dropped_entries_total[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Alloy is dropping log entries on {{ $labels.server_name }}"
          description: "Alloy ({{ $labels.instance }}) is dropping {{ $value | printf \"%.2f\" }} entries/sec because Loki is rejecting or not accepting them."

      - alert: LokiServerErrors
        expr: sum by (cluster, instance, route) (rate(loki_request_duration_seconds_count{status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Loki is returning 5xx errors on {{ $labels.route }}"
          description: "Loki ({{ $labels.instance }}) has returned server errors on route {{ $labels.route }} for 5 minutes."

  # ---------------------------------------------------------------------------
  # Tahseel's certificate cannot be probed by blackbox (its URL only resolves inside the
  # SonicWall). scripts/ssl_cert_metrics.sh on uc01 publishes it through node_exporter, which
  # already reaches us over the existing tunnel (172.17.0.1:19100). These rules re-label it as
  # the blackbox series (job="ssl_cert_url"), so the SSL dashboard and alerts include Tahseel.
  # ---------------------------------------------------------------------------
  - name: ssl_certificate_textfile
    rules:
      - record: probe_ssl_earliest_cert_expiry
        expr: max by (domain) (ssl_cert_not_after_timestamp_seconds{job="debian_servers", server_name="Tahseel"} > 0)
        labels: &tahseel_ssl
          job: ssl_cert_url
          cluster: tahseel
          project: Tahseel
          instance: ira.ucprem.voicemeetme.com:443
          check: url
          reachable: "yes"

      - record: probe_success
        # 0 if verification failed, or if the cron job has not updated the file for over an hour.
        expr: |
          max by (domain) (
            ssl_cert_check_success{job="debian_servers", server_name="Tahseel"}
            * on (domain)
            (time() - ssl_cert_last_check_timestamp_seconds{job="debian_servers", server_name="Tahseel"} < bool 3600)
          )
        labels: *tahseel_ssl

      - record: probe_ssl_last_chain_info
        expr: max by (domain, issuer, subject) (ssl_cert_info{job="debian_servers", server_name="Tahseel"})
        labels: *tahseel_ssl

  # ---------------------------------------------------------------------------
  # SSL certificates of the 8 cluster application URLs (job ssl_cert_url, targets in
  # targets/ssl/urls.json; Tahseel via the ssl_certificate_textfile rules above).
  # Let's Encrypt renews at 30 days left, so 10 days left means renewal has failed.
  # ---------------------------------------------------------------------------
  - name: ssl_certificate_alerts
    rules:
      - alert: SslCertExpiringIn10Days
        expr: (probe_ssl_earliest_cert_expiry{job=~"ssl_cert_.*"} - time()) < 10 * 86400
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "SSL cert for {{ $labels.domain }} ({{ $labels.project }}) expires in {{ $value | humanizeDuration }}"
          description: "The SSL certificate for {{ $labels.domain }} ({{ $labels.project }}) has {{ $value | humanizeDuration }} left (alert threshold: 10 days). Let's Encrypt should have renewed it at 30 days left: renew it and check certbot/acme renewal on the {{ $labels.project }} servers."

      - alert: SslCertCheckFailed
        # An expired, untrusted or wrong-name certificate fails the TLS handshake, so the expiry
        # date above stops being reported; this alert covers that case and unreachable sites.
        # Targets with reachable="no"/"pending" show on the dashboard only.
        expr: probe_success{job=~"ssl_cert_.*", reachable!~"no|pending"} == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "SSL check failing for {{ $labels.domain }} ({{ $labels.project }})"
          description: "The TLS check for {{ $labels.domain }} ({{ $labels.project }}) has failed for 30 minutes: the certificate is expired, untrusted or for the wrong name, or the site is unreachable from the monitoring server."
