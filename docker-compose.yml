networks:
  monitoring:
    driver: bridge
  # npm:
  #   external: true
  #   name: nginx-proxy-manager_default

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

services:
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    user: root
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: alertmanager
    restart: unless-stopped
    user: root
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
      - ./alertmanager/secrets/slack_api_url:/etc/alertmanager/secrets/slack_api_url:ro
      - ./alertmanager/secrets/flock_webhook_url:/etc/alertmanager/secrets/flock_webhook_url:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - monitoring

  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: "host"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.rootfs=/rootfs"
      - "--path.sysfs=/host/sys"
      - "--collector.netdev"
      - "--collector.netstat"
      - "--collector.sockstat"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc|run|var/lib/docker)($$|/)"
    profiles:
      - optional

  custom-nginx-python-exporter:
    image: nginx-python:latest
    container_name: custom-nginx-python-exporter
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER_NAME: nginx-proxy-manager
      STUB_STATUS_URL: http://nginx-proxy-manager_app_1:8080/nginx_status
      LOG_DIRECTORY: /var/log/nginx
      SCRAPE_INTERVAL: "2"
    volumes:
      - /opt/docker/nginx-proxy-manager/data/logs:/var/log/nginx:ro
    networks:
      - monitoring
      # - npm

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.25.0
    container_name: blackbox-exporter
    restart: unless-stopped
    ports:
      - "9115:9115"
    volumes:
      - ./blackbox/blackbox.yml:/etc/blackboxexporter/config.yml:ro
    command:
      - "--config.file=/etc/blackboxexporter/config.yml"
    cap_add:
      - NET_RAW
    networks:
      - monitoring
