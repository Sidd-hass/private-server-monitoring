# /etc/sip_peer_metrics.conf on uc11 / uc12 (UCDEMO). Format: see ucpin.conf.
#
# UNCONFIRMED: 203.199.43.5 is the only Tata Communications address in the fonouc-sip
# fail2ban ignoreip on uc11/uc12 (2026-11-25); no call legs to it were in the recent logs and
# the port is assumed. Confirm IP and port (offnet resource in Kazoo) before deploying.
peer   tata  203.199.43.5  5060  options

listen kamailio    5060  udp
listen freeswitch  11000 udp

log /var/log/freeswitch/kazoo-debug.log
