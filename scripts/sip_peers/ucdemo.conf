# /etc/sip_peer_metrics.conf on uc11 / uc12 (UCDEMO). Format: see ucpin.conf.
#
# UCDEMO has no Tata trunk: no trusted ACL entry is named Tata and no carrier call legs were seen
# (2026-11-27). The two peers below are trusted ACL entries (names from system_config/ecallmgr):
#
# mc_int_new 103.173.93.109: not a carrier, an office/NAT address whose UCP softphone users
#   register over WSS/TLS (random source ports, seen on uc11). No OPTIONS ping ("none"); what
#   matters is that we never ban it (fail2ban / ipset / Kamailio secban = everyone there loses phones).
# mcint1 203.199.43.5: trusted (Tata Communications range), no SIP seen recently. OPTIONS ping on
#   5060; a peer that never answers never raises "carrier end" (it needs a reply in the last 7 days).
peer   mc_int_new  103.173.93.109  5060  none
peer   mcint1      203.199.43.5    5060  options

listen kamailio    5060  udp
listen freeswitch  11000 udp

log /var/log/freeswitch/kazoo-debug.log
