# /etc/sip_peer_metrics.conf on ucpmed02 ONLY (UCPMED). Format: see ucpin.conf.
#
# Carrier: Etisalat One Access SBC 192.168.3.1, reached over an L2 segment: VXLAN vni 100 (vxlan0,
# 192.168.3.2) inside the IPsec tunnel "etisalat-office" (xfrm202) to Meydan's FortiGate
# 94.202.113.194. The trunk FreeSWITCH (fonouc_freeswitch_trunk, ESL 8023) has profiles
# from_external 192.168.3.2:5060 and to_external :5080, no registration gateway.
# ucpmed01 is not a peer of the FortiGate tunnel: do not install there.
peer   etisalat  192.168.3.1  5060  options

# Tunnel layer: if any of these is down the verdict is "TUNNEL", not "carrier end".
tunnel ipsec etisalat-office
iface  xfrm202
iface  vxlan0

# The trunk FreeSWITCH must be bound on 192.168.3.2 (route source towards the SBC).
listen freeswitch  5060  udp
listen freeswitch  5080  udp

# ucpmed-tunnel firewall: the SBC may only reach these (vxlan0 drops the rest).
allow udp 5060
allow udp 50000

log /var/log/freeswitch_trunk/kazoo-debug.log
