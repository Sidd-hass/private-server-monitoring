# /etc/sip_peer_metrics.conf on ucpin11 / ucpin12 / ucpin13 (read by sip_peer_metrics.py)
#
# peer   <carrier> <ip> <port> [options|none]   options = send a SIP OPTIONS every run
# listen <process> <port> [udp|tcp]             SIP listeners that must be bound on the peer-facing IP
# log    <path>                                 FreeSWITCH log with the peer's call legs
#
# Tata SIP trunk: offnet resource virtual2_tata-sip / -myflotpri, FreeSWITCH sends to it from
# sipinterface_1 (eth0, :11000); calls from it arrive at Kamailio :5060. Found 2026-11-25.
peer   tata  27.107.220.70  5095  options

listen kamailio    5060  udp
listen freeswitch  11000 udp

log /var/log/freeswitch/kazoo-debug.log
