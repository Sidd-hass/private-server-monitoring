global:
  resolve_timeout: 5m
  slack_api_url: '${SLACK_WEBHOOK_URL}'

route:
  group_by: ['alertname', 'server_name', 'instance']
  group_wait: 0s         # Send new incoming alerts immediately (no initial delay)
  group_interval: 10s    # Send any newly triggered alerts almost instantly
  repeat_interval: 15m   # Repeat notifications every 15 minutes if the alert remains firing
  receiver: 'combined-notifications'

receivers:
  - name: 'combined-notifications'
    slack_configs:
      - channel: '#prometheus-alerts' # Match your Slack channel name
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}] {{ else }}✅ [RESOLVED] {{ end }}{{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* `{{ .Labels.severity }}`
            *Instance:* `{{ .Labels.instance }}`
          {{ end }}
    webhook_configs:
      - url: '${FLOCK_WEBHOOK_URL}'
        send_resolved: true