global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_api_url

route:
  # 'gateway' keeps each SIP trunk in its own group (sj02 carries two trunks).
  group_by: ['alertname', 'server_name', 'instance', 'gateway']
  # First notification and RESOLVED go out immediately (within ~10s).
  group_wait: 0s
  group_interval: 10s
  # An unresolved alert is re-sent every 4h: at most 6 notifications per 24h.
  repeat_interval: 4h
  receiver: 'combined-notifications'
  routes:
    # Ping probe alerts keep their original cadence: immediate, then every 15 minutes while down.
    - matchers:
        - alertname =~ "PublicPingDown|PrivatePingDown|meydanGatewayUnreachable"
      receiver: 'combined-notifications'
      repeat_interval: 15m

receivers:
  - name: 'combined-notifications'
    slack_configs:
      - channel: '#prometheus-alerts'
        send_resolved: true
        title: '{{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}] {{ else }}✅ [RESOLVED] {{ end }}{{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}
            *Alert:* {{ .Annotations.summary }}
            *Description:* {{ .Annotations.description }}
            *Severity:* `{{ .Labels.severity }}`
            *Instance:* `{{ .Labels.instance }}`
          {{ end }}
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/flock_webhook_url
        send_resolved: true
