global:
  resolve_timeout: 5m
  slack_api_url_file: /etc/alertmanager/secrets/slack_api_url

route:
  # 'gateway' keeps each SIP trunk in its own group (sj02 carries two trunks).
  group_by: ['alertname', 'server_name', 'instance', 'gateway']
  # Batch changes: first notification after 30s, further changes in a group at most every 5m.
  group_wait: 30s
  group_interval: 5m
  # An unresolved alert is re-sent every 4h: at most 6 notifications per 24h.
  repeat_interval: 4h
  # Alerts without a known cluster label: Slack + the original (main) Flock channel only.
  receiver: 'combined-notifications'
  # Each cluster's alerts go to that cluster's Flock channel, the original (main) Flock channel and Slack.
  # Flock webhook URLs live in secrets/flock_channels.env, read by flock-relay.
  routes:
    - matchers: ['cluster = "ucpin"']
      receiver: 'flock-ucpin'
      routes:
        # Ping probe alerts keep their original cadence: immediate, then every 15 minutes while down.
        # Reused below for every cluster (&ping_route).
        - &ping_route
          matchers:
            - alertname =~ "PublicPingDown|PrivatePingDown|meydanGatewayUnreachable"
          repeat_interval: 15m
    - matchers: ['cluster = "ucdemo"']
      receiver: 'flock-ucdemo'
      routes: [*ping_route]
    - matchers: ['cluster = "ucpmed"']
      receiver: 'flock-ucpmed'
      routes: [*ping_route]
    - matchers: ['cluster = "multicomm"']
      receiver: 'flock-multicomm'
      routes: [*ping_route]
    - matchers: ['cluster = "meydan"']
      receiver: 'flock-meydan'
      routes: [*ping_route]
    - matchers: ['cluster = "shams"']
      receiver: 'flock-shams'
      routes: [*ping_route]
    - matchers: ['cluster = "dubai_south"']
      receiver: 'flock-dubai-south'
      routes: [*ping_route]
    - matchers: ['cluster = "spc"']
      receiver: 'flock-spc'
      routes: [*ping_route]
    - matchers: ['cluster = "tahseel"']
      receiver: 'flock-tahseel'
      routes: [*ping_route]
    - matchers:
        - alertname =~ "PublicPingDown|PrivatePingDown|meydanGatewayUnreachable"
      receiver: 'combined-notifications'
      repeat_interval: 15m

receivers:
  - name: 'combined-notifications'
    # Same Slack message for every receiver (&slack).
    slack_configs: &slack
    - channel: '#prometheus-alerts'
      send_resolved: true
      title: '{{ if eq .Status "firing" }}🔥 [FIRING:{{ .Alerts.Firing | len }}] {{ else }}✅ [RESOLVED] {{ end }}{{ .CommonLabels.alertname }}'
      text: >-
        {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* `{{ .Labels.severity }}`
          *Instance:* `{{ .Labels.instance }}`
        {{ end }}
    webhook_configs:
      - url_file: /etc/alertmanager/secrets/flock_webhook_url
        send_resolved: true

  - name: 'flock-ucpin'
    slack_configs: *slack
    webhook_configs:
      - url: 'http://flock-relay:9099/ucpin'
        send_resolved: true
      - url_file: /etc/alertmanager/secrets/flock_webhook_url
        send_resolved: true
  - name: 'flock-ucdemo'
    slack_configs: *slack
    webhook_configs:
      - url: 'http://flock-relay:9099/ucdemo'
        send_resolved: true
      - url_file: /etc/alertmanager/secrets/flock_webhook_url
        send_resolved: true
  - name: 'flock-ucpmed'
    slack_configs: *slack
    webhook_configs:
      - url: 'http://flock-relay:9099/ucpmed'
        send_resolved: true
      - url_file: /etc/alertmanager/secrets/flock_webhook_url
