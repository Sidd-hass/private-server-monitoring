modules:
  icmp_ping:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"

  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: [] # Defaults to 2xx
      method: GET
      preferred_ip_protocol: "ip4"

  # SSL certificate checks (probe_ssl_earliest_cert_expiry), used by the ssl_cert_* jobs.
  # Full verification, so an expired, untrusted or wrong-name cert fails the probe.
  tls_cert:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      tls: true

  # SPC's public IPs drop port 443 from the monitoring server, so SPC is probed on sj03's
  # OpenVPN address (172.16.200.104); the cert is still verified against the real name.
  tls_cert_spc:
    prober: tcp
    timeout: 10s
    tcp:
      preferred_ip_protocol: "ip4"
      tls: true
      tls_config:
        server_name: "ira-spc-sj.ucprem.voicemeetme.com"

  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      preferred_ip_protocol: "ip4"
      query_name: "google.com"
      query_type: "A"