# nginx-proxy-manager → Hosts → Proxy Hosts → ocubedashboards.voicemeetme.net → Edit → Advanced.
# Paste everything below this header into "Custom Nginx Configuration" and Save.
# NPM regenerates data/nginx/proxy_host/24.conf on every save, so this copy is the source of truth.
#
# Details tab for the same host: Forward Hostname/IP = grafana, Forward Port = 3000
# (Grafana is published on 127.0.0.1 only; NPM reaches it on the npm Docker network).
#
# Password file (bcrypt), created on 244 and seen by the NPM container as /data/prometheus.htpasswd:
#   htpasswd -c -B /opt/docker/nginx-proxy-manager/data/prometheus.htpasswd <user>
#   chmod 644 /opt/docker/nginx-proxy-manager/data/prometheus.htpasswd

# Second password file, for the Kazoo node log shippers (/loki-push/ below):
#   htpasswd -c -B /opt/docker/nginx-proxy-manager/data/loki-push.htpasswd kazoo-logs
#   chmod 644 /opt/docker/nginx-proxy-manager/data/loki-push.htpasswd

location = /prometheus { return 301 /prometheus/; }

# Wazuh dashboard (wazuh/ on 246) over the private network 10.20.0.0/24. The dashboard serves
# everything under /wazuh (server.basePath, rewriteBasePath) and has its own login.
# Its certificate is self-signed, so it is not verified on this private hop.
location = /wazuh { return 301 /wazuh/; }

location ^~ /wazuh/ {
    proxy_pass https://10.20.0.246:5443;
    proxy_ssl_verify off;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    client_max_body_size 50m;
}

# Log push from Kazoo nodes without VPN (alloy/kazoo-node on UCPIN / UCDEMO / UCPMED) into
# 244's Alloy receiver (alloy/config.alloy, loki.source.api "kazoo_nodes"). Only these node
# IPs, with the kazoo-logs password. Alloy keeps only job="kazoo-node" streams of those clusters.
location ^~ /loki-push/ {
    allow 151.243.12.57;    # ucpin11
    allow 151.243.12.59;    # ucpin12
    allow 151.243.12.60;    # ucpin13
    allow 181.214.10.237;   # uc11 (ucdemo)
    allow 181.214.10.238;   # uc12 (ucdemo)
    allow 143.14.172.231;   # ucpmed01
    allow 143.14.172.232;   # ucpmed02
    deny  all;

    auth_basic           "Loki push";
    auth_basic_user_file /data/loki-push.htpasswd;

    client_max_body_size 10m;
    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 60s;
    # Trailing slash strips /loki-push: Alloy serves /loki/api/v1/push.
    proxy_pass http://alloy:3501/;
}

# Lifecycle (reload/quit) and admin API: on 244 only, via curl to 127.0.0.1:9090.
location ^~ /prometheus/-/ { deny all; }
location ^~ /prometheus/api/v1/admin/ { deny all; }

location ^~ /prometheus/ {
    auth_basic           "Prometheus";
    auth_basic_user_file /data/prometheus.htpasswd;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    # Trailing slash strips /prometheus: Prometheus serves its routes at / (--web.route-prefix=/).
    proxy_pass http://prometheus:9090/;
}
